name: 构建 iOS OmniDownloader.ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: 编译与打包 IPA
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: 编译并归档 (Archive)
        working-directory: ./OmniDownloader-iOS
        run: |
          xcodebuild archive \
            -workspace OmniDownloader.xcworkspace \
            -scheme OmniDownloader \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/OmniDownloader.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 导出为 IPA
        working-directory: ./OmniDownloader-iOS
        run: |
          mkdir -p Payload
          cp -r build/OmniDownloader.xcarchive/Products/Applications/OmniDownloader.app Payload/
          zip -r OmniDownloader.ipa Payload

      - name: 上传 IPA 构件
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader.ipa
          path: OmniDownloader-iOS/OmniDownloader.ipa
