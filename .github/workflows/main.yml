name: 构建 iOS OmniDownloader.ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'OmniDownloader-iOS/**'

jobs:
  build-ipa:
    name: 编译与打包 IPA
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: 编译 iOS App (Release)
        working-directory: ./OmniDownloader-iOS
        run: |
          xcodebuild build \
            -project OmniDownloader.xcodeproj \
            -scheme OmniDownloader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -r OmniDownloader-iOS/build/Build/Products/Release-iphoneos/OmniDownloader.app Payload/
          zip -r OmniDownloader.ipa Payload

      - name: 上传 IPA 构件
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader.ipa
          path: OmniDownloader.ipa
